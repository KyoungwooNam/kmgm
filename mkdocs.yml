site_name: KMGM
site_description: KMGM 문서
site_author: kwnam
docs_dir: docs
site_dir: site
site_url: https://kyoungwoonam.github.io/kmgm/
repo_url: https://github.com/KyoungwooNam/kmgm
repo_name: KyoungwooNam/kmgm
edit_uri: edit/main/docs/

theme:
  name: material
  language: ko
  features:
    - navigation.instant
    - navigation.sections
    - navigation.top
    - search.highlight
    - search.suggest
    - content.code.copy
    - toc.follow
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: 다크 모드
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: 라이트 모드

nav:
  - 홈: index.md
  - 문서 작성 가이드: writing.md

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.tabbed:
      alternate_style: true
  - tables
  - toc:
      permalink: true

plugins:
  - search

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/KyoungwooNam/kmgm
